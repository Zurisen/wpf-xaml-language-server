name: CI

on:
  push:
    branches: [master]
  pull_request:
  # Weekly, so vulnerability advisories published for our dependencies show up even without new commits.
  schedule:
    - cron: "0 6 * * 1"

# Read-only token: CI never writes to the repository (matters once pull requests come from forks).
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs everything, including the MSBuild end-to-end test against samples/.
        # Ubuntu checks the server builds and runs off Windows; WPF-dependent tests skip there.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          # The samples target net8.0-windows.
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build WpfXamlLs.slnx -c Release

      - name: Test
        run: dotnet test --solution WpfXamlLs.slnx -c Release --no-build

      # Fails on any known vulnerability in a direct or transitive package (builds only warn, see Directory.Build.props).
      - name: Check for vulnerable packages
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          dotnet list WpfXamlLs.slnx package --vulnerable --include-transitive | tee vulnerable.txt
          if grep -q "has the following vulnerable packages" vulnerable.txt; then
            echo "::error::Vulnerable packages found (see the list above). Update the package that brings them in."
            exit 1
          fi

      - name: Pack
        if: matrix.os == 'windows-latest'
        run: dotnet pack src/WpfXaml.LanguageServer -c Release -o artifacts --no-build

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: wpf-xaml-ls-nupkg
          path: artifacts/*.nupkg

  vscode-extension:
    # Type-checks and packages editors/vscode, then runs it end to end in a downloaded VS Code against the samples.
    runs-on: windows-latest
    defaults:
      run:
        working-directory: editors/vscode

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
          dotnet-version: 8.0.x

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Build the server and the samples
        working-directory: .
        run: |
          dotnet build src/WpfXaml.LanguageServer
          dotnet build samples/SampleWpfApp

      - run: npm ci

      - name: Type-check
        run: npm run typecheck

      - name: Package
        run: npm run package

      - uses: actions/upload-artifact@v7
        with:
          name: wpf-xaml-ls-vsix
          path: editors/vscode/dist/*.vsix

      - name: End-to-end test in VS Code
        run: npm test
