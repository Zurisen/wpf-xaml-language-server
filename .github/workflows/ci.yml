name: CI

on:
  push:
    branches: [master]
  pull_request:

# Read-only token: CI never writes to the repository (matters once pull requests come from forks).
permissions:
  contents: read

jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        # Windows runs everything, including the MSBuild end-to-end test against samples/.
        # Ubuntu checks the server builds and runs off Windows; WPF-dependent tests skip there.
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          # The samples target net8.0-windows.
          dotnet-version: 8.0.x

      - name: Build
        run: dotnet build WpfXamlLs.slnx -c Release

      - name: Test
        run: dotnet test --solution WpfXamlLs.slnx -c Release --no-build

      - name: Pack
        if: matrix.os == 'windows-latest'
        run: dotnet pack src/WpfXaml.LanguageServer -c Release -o artifacts --no-build

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: wpf-xaml-ls-nupkg
          path: artifacts/*.nupkg
