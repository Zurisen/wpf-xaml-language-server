name: Feature request
description: A new check, completion, editor integration or other improvement.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like the server to do?
      description: Ideally with a XAML example showing where it would help.
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why does it matter to you?
      description: Your editor, your codebase, or how you'd use it.
  - type: textarea
    id: notes
    attributes:
      label: Anything else?
      description: How Visual Studio or Rider behaves here, links to WPF documentation, ideas for the implementation.
